<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante Sabor Único - Contacto</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f9f9f9; color: #333;">

    <nav style="background-color: #2c3e50; padding: 15px; text-align: center;">
        <a href="index.html" style="color: #ffffff; margin: 0 15px; text-decoration: none; font-weight: bold;">Inicio</a>
        <a href="about.html" style="color: #ffffff; margin: 0 15px; text-decoration: none; font-weight: bold;">Nosotros</a>
        <a href="contact.html" style="color: #ffffff; margin: 0 15px; text-decoration: none; font-weight: bold;">Contacto</a>
    </nav>

    <main style="max-width: 800px; margin: 40px auto; padding: 20px; background-color: #ffffff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <h1 style="color: #e67e22; text-align: center;">Contáctanos</h1>
        <p style="text-align: center; font-size: 1.1em;">Haz tu reserva o envíanos un mensaje.</p>
        
        <form style="display: flex; flex-direction: column; gap: 15px; max-width: 500px; margin: 0 auto;">
            <label style="font-weight: bold;">Nombre:</label>
            <input type="text" placeholder="Tu nombre" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            
            <label style="font-weight: bold;">Correo Electrónico:</label>
            <input type="email" placeholder="tu@email.com" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            
            <label style="font-weight: bold;">Mensaje:</label>
            <textarea rows="4" placeholder="Escribe tu mensaje o detalles de reserva..." style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
            
            <button type="button" style="background-color: #e67e22; color: white; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Enviar Mensaje</button>
        </form>
    </main>

    <footer style="text-align: center; padding: 15px; background-color: #ecf0f1; margin-top: 40px; font-size: 0.9em; color: #7f8c8d;">
        &copy; 2026 Restaurante Sabor Único. Todos los derechos reservados.
    </footer>

</body>
</html>
